    // ===== 组件构建函数 =====

    function buildKpiCard(data) {
      return '<div class="kpi-card">' +
        '<div class="kpi-top">' +
        '  <div class="kpi-icon ' + data.iconColor + '"><i class="fas ' + data.icon + '"></i></div>' +
        '  <span class="kpi-trend ' + data.trendDir + '">' +
        '    <i class="fas fa-arrow-' + (data.trendDir === 'up' ? 'up' : 'down') + '"></i> ' + data.trend +
        '  </span>' +
        '</div>' +
        '<div class="kpi-label">' + data.label + '</div>' +
        '<div class="kpi-value mono">' + data.value + '</div>' +
        '<div class="kpi-trend-sub">' + data.sub + '</div>' +
        '</div>';
    }

    // 收入趋势折线图 (SVG)
    function buildLineChart() {
      // 30天模拟数据
      var data = [
        42000, 45000, 48000, 52000, 49000, 55000, 58000,
        62000, 59000, 65000, 68000, 72000, 70000, 75000,
        78000, 82000, 85000, 80000, 88000, 92000, 95000,
        90000, 98000, 102000, 105000, 100000, 108000, 112000,
        115000, 120000
      ];
      var w = 700, h = 260, pad = { top: 20, right: 20, bottom: 30, left: 50 };
      var cw = w - pad.left - pad.right;
      var ch = h - pad.top - pad.bottom;
      var max = Math.max.apply(null, data) * 1.1;
      var min = 0;

      var points = data.map(function (v, i) {
        var x = pad.left + (i / (data.length - 1)) * cw;
        var y = pad.top + ch - ((v - min) / (max - min)) * ch;
        return [x, y];
      });

      // 路径
      var pathD = points.map(function (p, i) {
        return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1);
      }).join(' ');

      // 面积填充路径
      var areaD = pathD +
        ' L' + points[points.length - 1][0].toFixed(1) + ',' + (pad.top + ch) +
        ' L' + points[0][0].toFixed(1) + ',' + (pad.top + ch) + ' Z';

      // Y 轴刻度
      var yTicks = '';
      var yLabels = [0, 30000, 60000, 90000, 120000];
      yLabels.forEach(function (v) {
        var y = pad.top + ch - (v / max) * ch;
        yTicks += '<line x1="' + pad.left + '" y1="' + y.toFixed(1) + '" x2="' + (w - pad.right) + '" y2="' + y.toFixed(1) + '" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>';
        yTicks += '<text x="' + (pad.left - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">' + (v >= 1000 ? (v / 1000) + 'k' : v) + '</text>';
      });

      // X 轴刻度 (每5天)
      var xTicks = '';
      var xLabels = ['1日', '5日', '10日', '15日', '20日', '25日', '30日'];
      [0, 4, 9, 14, 19, 24, 29].forEach(function (idx, i) {
        var x = pad.left + (idx / (data.length - 1)) * cw;
        xTicks += '<text x="' + x.toFixed(1) + '" y="' + (h - pad.bottom + 18) + '" text-anchor="middle" fill="#94A3B8" font-size="11">' + xLabels[i] + '</text>';
      });

      // 最后一个数据点高亮
      var last = points[points.length - 1];
      var dot = '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="5" fill="#fff" stroke="#3B82F6" stroke-width="2"/>';

      return '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' +
        '<defs><linearGradient id="lineGrad" x1="0" x2="0" y1="0" y2="1">' +
        '<stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>' +
        '<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        yTicks +
        xTicks +
        '<path d="' + areaD + '" fill="url(#lineGrad)"/>' +
        '<path d="' + pathD + '" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
        dot +
        '</svg>';
    }

    // 渠道占比环形图
    function buildDonutChart(lang) {
      var channels = lang === 'zh'
        ? [
            { name: '自然搜索', value: 38, color: '#3B82F6' },
            { name: '社交媒体', value: 25, color: '#8B5CF6' },
            { name: '直接访问', value: 20, color: '#10B981' },
            { name: '付费广告', value: 12, color: '#F59E0B' },
            { name: '其他渠道', value: 5, color: '#94A3B8' }
          ]
        : [
            { name: 'Organic Search', value: 38, color: '#3B82F6' },
            { name: 'Social Media', value: 25, color: '#8B5CF6' },
            { name: 'Direct Traffic', value: 20, color: '#10B981' },
            { name: 'Paid Ads', value: 12, color: '#F59E0B' },
            { name: 'Other', value: 5, color: '#94A3B8' }
          ];

      var cx = 80, cy = 80, r = 65, innerR = 45;
      var total = channels.reduce(function (s, c) { return s + c.value; }, 0);
      var startAngle = -Math.PI / 2;

      var arcs = '';
      channels.forEach(function (ch) {
        var angle = (ch.value / total) * Math.PI * 2;
        var endAngle = startAngle + angle;
        var largeArc = angle > Math.PI ? 1 : 0;

        var x1 = cx + r * Math.cos(startAngle);
        var y1 = cy + r * Math.sin(startAngle);
        var x2 = cx + r * Math.cos(endAngle);
        var y2 = cy + r * Math.sin(endAngle);

        var ix1 = cx + innerR * Math.cos(endAngle);
        var iy1 = cy + innerR * Math.sin(endAngle);
        var ix2 = cx + innerR * Math.cos(startAngle);
        var iy2 = cy + innerR * Math.sin(startAngle);

        var d = 'M' + x1.toFixed(2) + ',' + y1.toFixed(2) +
          ' A' + r + ',' + r + ' 0 ' + largeArc + ' 1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) +
          ' L' + ix1.toFixed(2) + ',' + iy1.toFixed(2) +
          ' A' + innerR + ',' + innerR + ' 0 ' + largeArc + ' 0 ' + ix2.toFixed(2) + ',' + iy2.toFixed(2) +
          ' Z';

        arcs += '<path d="' + d + '" fill="' + ch.color + '"/>';
        startAngle = endAngle;
      });

      var svg = '<svg class="donut-svg" width="160" height="160" viewBox="0 0 160 160">' +
        arcs +
        '<text x="80" y="74" text-anchor="middle" fill="#64748B" font-size="12">' + (lang === 'zh' ? '总收入' : 'Total') + '</text>' +
        '<text x="80" y="94" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700" font-family="ui-monospace, monospace">¥2.85M</text>' +
        '</svg>';

      var legend = '<ul class="legend-list">';
      channels.forEach(function (ch) {
        legend += '<li class="legend-item">' +
          '<span class="legend-dot" style="background:' + ch.color + '"></span>' +
          '<span class="legend-label">' + ch.name + '</span>' +
          '<span class="legend-value mono">' + ch.value + '%</span>' +
          '</li>';
      });
      legend += '</ul>';

      return '<div class="donut-wrap">' + svg + legend + '</div>';
    }

    // 地区排行
    function buildRegionRank(lang) {
      var regions = lang === 'zh'
        ? [
            { name: '广东省', value: 485200 },
            { name: '北京市', value: 412800 },
            { name: '上海市', value: 389500 },
            { name: '浙江省', value: 342100 },
            { name: '江苏省', value: 298700 },
            { name: '四川省', value: 215400 },
            { name: '湖北省', value: 187600 },
            { name: '山东省', value: 156300 }
          ]
        : [
            { name: 'Guangdong', value: 485200 },
            { name: 'Beijing', value: 412800 },
            { name: 'Shanghai', value: 389500 },
            { name: 'Zhejiang', value: 342100 },
            { name: 'Jiangsu', value: 298700 },
            { name: 'Sichuan', value: 215400 },
            { name: 'Hubei', value: 187600 },
            { name: 'Shandong', value: 156300 }
          ];

      var max = regions[0].value;
      var html = '<ul class="rank-list">';
      regions.forEach(function (r, i) {
        var rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
        var pct = (r.value / max * 100).toFixed(1);
        var valStr = '¥' + (r.value / 10000).toFixed(1) + '万';
        if (lang === 'en') valStr = '¥' + (r.value / 1000).toFixed(0) + 'K';
        html += '<li class="rank-item">' +
          '<span class="rank-num ' + rankClass + '">' + (i + 1) + '</span>' +
          '<span class="rank-name">' + r.name + '</span>' +
          '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + pct + '%"></div></div>' +
          '<span class="rank-value mono">' + valStr + '</span>' +
          '</li>';
      });
      html += '</ul>';
      return html;
    }

    // 转化漏斗
    function buildFunnelChart(lang, t) {
      var funnel = [
        { label: t.funnelVisit, value: 284500, rate: '100%', color: '#3B82F6' },
        { label: t.funnelRegister, value: 85350, rate: '30%', color: '#6366F1' },
        { label: t.funnelActive, value: 48291, rate: '56.6%', color: '#8B5CF6' },
        { label: t.funnelOrder, value: 21476, rate: '44.5%', color: '#A855F7' },
        { label: t.funnelPay, value: 12847, rate: '59.8%', color: '#10B981' }
      ];

      var max = funnel[0].value;
      var html = '';
      funnel.forEach(function (f) {
        var widthPct = (f.value / max * 100).toFixed(1);
        var valStr = f.value.toLocaleString();
        html += '<div class="funnel-item">' +
          '<div class="funnel-label">' + f.label + '</div>' +
          '<div class="funnel-bar-wrap">' +
          '  <div class="funnel-bar" style="width:' + widthPct + '%;background:' + f.color + ';">' + valStr + '</div>' +
          '</div>' +
          '<div class="funnel-value mono">' + valStr + '</div>' +
          '<div class="funnel-rate">' + f.rate + '</div>' +
          '</div>';
      });
      return html;
    }

    // 异常列表
    function buildAnomalyList(lang) {
      var anomalies = lang === 'zh'
        ? [
            { level: 'danger', icon: 'fa-exclamation-triangle', title: '华东区订单量骤降 35%', desc: '检测到过去24小时内华东地区订单量异常下降', time: '10分钟前' },
            { level: 'warning', icon: 'fa-chart-line', title: '平均客单价波动异常', desc: '移动端客单价较昨日上涨 18%，建议关注', time: '1小时前' },
            { level: 'danger', icon: 'fa-server', title: '支付接口响应超时', desc: '第三方支付通道 3 号节点连续 5 次超时', time: '2小时前' },
            { level: 'info', icon: 'fa-bolt', title: '新增用户数创本周新高', desc: '今日新增注册用户较日均增长 42%', time: '3小时前' },
            { level: 'warning', icon: 'fa-exclamation-circle', title: '退款率略高于阈值', desc: '数码类产品退款率达 4.2%，超过 3% 预警线', time: '5小时前' }
          ]
        : [
            { level: 'danger', icon: 'fa-exclamation-triangle', title: 'East China orders dropped 35%', desc: 'Abnormal drop detected in East China region in past 24h', time: '10m ago' },
            { level: 'warning', icon: 'fa-chart-line', title: 'AOV fluctuation abnormal', desc: 'Mobile AOV up 18% vs yesterday, recommend review', time: '1h ago' },
            { level: 'danger', icon: 'fa-server', title: 'Payment gateway timeout', desc: 'Payment channel node 3 timed out 5 times in a row', time: '2h ago' },
            { level: 'info', icon: 'fa-bolt', title: 'New users hit weekly high', desc: 'New registrations up 42% vs daily average', time: '3h ago' },
            { level: 'warning', icon: 'fa-exclamation-circle', title: 'Refund rate slightly above threshold', desc: 'Electronics refund rate at 4.2%, exceeds 3% threshold', time: '5h ago' }
          ];

      var html = '';
      anomalies.forEach(function (a) {
        html += '<div class="anomaly-item">' +
          '<div class="anomaly-icon ' + a.level + '"><i class="fas ' + a.icon + '"></i></div>' +
          '<div class="anomaly-content">' +
          '  <div class="anomaly-title">' + a.title + '</div>' +
