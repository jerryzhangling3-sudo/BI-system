function rand(){state.seed=(state.seed*9301+49297)%233280;return state.seed/233280}

function daily(total,days,salt=1){let raw=[],sum=0;for(let i=0;i<days;i++){let v=Math.max(.2,1+Math.sin((i+salt)*1.17)*.14+(rand()-.5)*.24);raw.push(v);sum+=v}let a=raw.map(v=>Math.floor(total*v/sum)),diff=Math.round(total)-a.reduce((x,y)=>x+y,0),i=0;while(diff>0){a[i++%a.length]++;diff--}return a}

function operationData(){let key=Number(state.operationMonth.replace("-","")),wave=Math.sin(key*.73),lp=4850000+wave*420000,clientClosed=1710000+Math.cos(key*.41)*260000,floating=360000+Math.sin(key*.27)*130000,dividend=138000+Math.cos(key*.32)*38000,negativeBalance=118000+Math.sin(key*.21)*26000,redPacket=96000+Math.cos(key*.26)*23000,clientCompensation=74000+Math.sin(key*.24)*16000,personalAgent=148000+Math.cos(key*.16)*28000,enterpriseAgent=179000+Math.sin(key*.14)*34000,fundAdjustment=84000+Math.cos(key*.31)*18000,inactivityFee=19000+Math.sin(key*.35)*6000,agentRebate=personalAgent+enterpriseAgent,operating=negativeBalance+redPacket+clientCompensation+agentRebate+fundAdjustment+inactivityFee,salary=286000+Math.sin(key*.11)*24000,office=92000+Math.cos(key*.13)*12000,technology=164000+Math.sin(key*.17)*19000,expenses=salary+office+technology,company=lp-clientClosed-(state.includeFloating?floating:0)-dividend-operating-expenses,deposits=8950000+Math.sin(key*.37)*1050000,withdrawals=5280000+Math.cos(key*.29)*840000,net=deposits-withdrawals,aClosed=680000+Math.sin(key*.44)*180000,bClosed=-1420000+Math.cos(key*.38)*260000,aGross=aClosed,bGross=-bClosed,spread=535000+Math.sin(key*.34)*115000,swaps=186000+Math.cos(key*.22)*41000,commission=245000+Math.sin(key*.28)*52000,totalGross=aGross+bGross+spread;return{lp,clientClosed,floating,dividend,operating,negativeBalance,redPacket,clientCompensation,personalAgent,enterpriseAgent,agentRebate,fundAdjustment,inactivityFee,salary,office,technology,expenses,company,deposits,withdrawals,net,aClosed,bClosed,aGross,bGross,spread,swaps,commission,totalGross}}
const operationDataLegacy=operationData;
operationData=function(){let d=operationDataLegacy(),key=Number(state.operationMonth.replace("-","")),fundGrant=Math.round(d.fundAdjustment*.58),fundDeduction=Math.round(d.fundAdjustment-fundGrant);d.lp=Object.prototype.hasOwnProperty.call(state.settlementEntries,state.operationMonth)?Number(state.settlementEntries[state.operationMonth]):0;d.clientClosed=Math.abs(d.clientClosed);d.floating=Math.abs(d.floating);d.dividend=Math.round(Math.sin(key*.67)*165000);["negativeBalance","redPacket","clientCompensation","personalAgent","inactivityFee"].forEach(k=>d[k]=-Math.abs(d[k]));d.fundGrant=-Math.abs(fundGrant);d.fundDeduction=-Math.abs(fundDeduction);d.agentRebate=d.personalAgent;d.operating=d.negativeBalance+d.redPacket+d.clientCompensation+d.personalAgent+d.fundGrant+d.fundDeduction+d.inactivityFee;d.expenses=0;let gross=d.lp+d.clientClosed+(state.includeFloating?d.floating:0)+d.dividend,bookGross=gross-d.spread;d.aGross=Math.round(bookGross*.38);d.bGross=bookGross-d.aGross;d.totalGross=gross;d.company=gross+d.operating;return d}
function statementDaily(total,days,salt=1){let weights=[],sum=0;for(let i=0;i<days;i++){let w=Math.max(.25,1+Math.sin((i+salt)*.71)*.2+Math.cos((i+salt)*.37)*.09);weights.push(w);sum+=w}let target=Math.round(Math.abs(total)),values=weights.map(w=>Math.floor(target*w/sum)),diff=target-values.reduce((a,b)=>a+b,0);for(let i=0;i<diff;i++)values[(i*7+salt)%days]++;return values.map(v=>total<0?-v:v)}

function operationStatement(){let d=operationData(),parts=state.operationMonth.split("-").map(Number),days=new Date(parts[0],parts[1],0).getDate(),dates=Array.from({length:days},(_,i)=>`${state.operationMonth}-${String(i+1).padStart(2,"0")}`),series={},add=(key,total,salt)=>series[key]=statementDaily(total,days,salt);add("lp",d.lp,2);add("clientClosed",d.clientClosed,4);series.floating=Array(days).fill(0);series.floating[days-1]=Math.round(d.floating);add("dividend",d.dividend,6);add("negativeBalance",d.negativeBalance,8);add("redPacket",d.redPacket,10);add("clientCompensation",d.clientCompensation,12);add("personalAgent",d.personalAgent,14);add("enterpriseAgent",d.enterpriseAgent,16);add("fundAdjustment",d.fundAdjustment,18);add("inactivityFee",d.inactivityFee,20);add("salary",d.salary,22);add("office",d.office,24);add("technology",d.technology,26);series.operating=sumSeries(series.negativeBalance,series.redPacket,series.clientCompensation,series.personalAgent,series.enterpriseAgent,series.fundAdjustment,series.inactivityFee);series.expenses=sumSeries(series.salary,series.office,series.technology);series.gross=series.lp.map((v,i)=>v-series.clientClosed[i]-(state.includeFloating?series.floating[i]:0)-series.dividend[i]);series.net=series.gross.map((v,i)=>v-series.operating[i]-series.expenses[i]);series.clientWorth=statementDaily(d.net+d.clientClosed,days,29);series.cfh=series.lp.map(v=>Math.round(v*.56));series.isPrime=series.lp.map((v,i)=>v-series.cfh[i]);return{d,days,dates,series}}

operationStatement=function(){let x=operationStatementLegacy(),d=x.d,s=x.series;s.fundGrant=statementDaily(d.fundGrant,x.days,18);s.fundDeduction=statementDaily(d.fundDeduction,x.days,19);s.operating=sumSeries(s.negativeBalance,s.redPacket,s.clientCompensation,s.personalAgent,s.fundGrant,s.fundDeduction,s.inactivityFee);s.expenses=Array(x.days).fill(0);s.gross=s.lp.map((v,i)=>v+s.clientClosed[i]+(state.includeFloating?s.floating[i]:0)+s.dividend[i]);s.net=s.gross.map((v,i)=>v+s.operating[i]);d.company=s.net.reduce((a,b)=>a+b,0);return x}

let lastGeneratedPassword="";
function generateTemporaryPassword(){let upper="ABCDEFGHJKLMNPQRSTUVWXYZ",lower="abcdefghijkmnopqrstuvwxyz",digits="23456789",special="!@#$%&*?",all=upper+lower+digits+special,pick=s=>s[Math.floor(Math.random()*s.length)],chars=[pick(upper),pick(lower),pick(digits),pick(special)];while(chars.length<12)chars.push(pick(all));for(let i=chars.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[chars[i],chars[j]]=[chars[j],chars[i]]}return chars.join("")}

emark" placeholder="填写创建原因、职责范围或其他说明"></textarea></div></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary" type="submit">${editing?"保存修改":"创建账户"}</button></div></form></div></div>`)}
function saveAccount(e,id){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(systemAccounts.some(x=>x.username===obj.username&&x.id!==id)){showToast("用户名已存在，请更换");return}let password=obj.initialPassword||"";delete obj.initialPassword;if(id){Object.assign(systemAccounts.find(x=>x.id===id),obj);closeModal();render();showToast("账户已更新")}else{systemAccounts.unshift({id:Date.now(),...obj,last:"从未登录",mustChangePassword:true});closeModal();render();showGeneratedPassword(obj.name,obj.username,password,"账户创建成功")}}

function toggleTreePage(pageId,action,checked){businessPermissionTree.flatMap(x=>x.pages).find(x=>x.id===pageId)?.metrics.forEach(x=>{let el=document.querySelector(`[data-permission="${metricPerm(pageId,x[0],action)}"]`);if(el)el.checked=checked});syncPermissionParents()}
function toggleTreeModule(pageIds,action,checked){pageIds.split(",").forEach(id=>toggleTreePage(id,action,checked));syncPermissionParents()}
function syncPermissionParents(){businessPermissionTree.forEach(module=>{["view","export"].forEach(action=>{if(module.id==="base"&&action==="export")return;module.pages.forEach(page=>{let boxes=page.metrics.map(x=>document.querySelector(`[data-permission="${metricPerm(page.id,x[0],action)}"]`)).filter(Boolean),parent=document.querySelector(`[data-tree-page="${page.id}.${action}"]`);if(parent){parent.checked=boxes.length>0&&boxes.every(x=>x.checked);parent.indeterminate=boxes.some(x=>x.checked)&&!parent.checked}});let moduleParent=document.querySelector(`[data-tree-module="${module.id}.${action}"]`),pageParents=module.pages.map(page=>document.querySelector(`[data-tree-page="${page.id}.${action}"]`)).filter(Boolean);if(moduleParent){moduleParent.checked=pageParents.length>0&&pageParents.every(x=>x.checked);moduleParent.indeterminate=pageParents.some(x=>x.checked||x.indeterminate)&&!moduleParent.checked}})})}
function toggleManagementPage(pageId,checked){let page=managementPermissionTree.find(x=>x.id===pageId);page?.actions.forEach(x=>{let el=document.querySelector(`[data-permission="${x[0]}"]`);if(el)el.checked=checked});if(checked){let view=document.querySelector(`[data-permission="${page.view}"]`);if(view)view.checked=true}syncManagementParents()}
function toggleFinancialActions(checked){let el=document.querySelector('[data-permission="operations.settlement.edit"]');if(el)el.checked=checked;syncFinancialActions()}function syncFinancialActions(){let checked=!!document.querySelector('[data-permission="operations.settlement.edit"]')?.checked;$$("[data-financial-action-parent]").forEach(x=>x.checked=checked)}
function togglePageOperations(checked){$$("[data-page-operation-child]").forEach(x=>x.checked=checked);syncPageOperations()}function syncPageOperations(){let children=$$("[data-page-operation-child]"),all=children.length>0&&children.every(x=>x.checked),some=children.some(x=>x.checked);$$("[data-page-operation-parent]").forEach(x=>{x.checked=all;x.indeterminate=some&&!all})}
function toggleManagementView(pageId,checked){let page=managementPermissionTree.find(x=>x.id===pageId);if(!checked)page?.actions.forEach(x=>{let el=document.querySelector(`[data-permission="${x[0]}"]`);if(el)el.checked=false});syncManagementParents()}
function toggleManagementModule(kind,checked){managementPermissionTree.forEach(page=>{if(kind==="view"){let el=document.querySelector(`[data-permission="${page.view}"]`);if(el)el.checked=checked}else toggleManagementPage(page.id,checked)});syncManagementParents()}
function syncManagementParents(){managementPermissionTree.forEach(page=>{let actions=page.actions.map(x=>document.querySelector(`[data-permission="${x[0]}"]`)).filter(Boolean),view=document.querySelector(`[data-permission="${page.view}"]`);if(actions.some(x=>x.checked)&&view)view.checked=true;let parent=document.querySelector(`[data-management-page="${page.id}.action"]`);if(parent){parent.checked=actions.length>0&&actions.every(x=>x.checked);parent.indeterminate=actions.some(x=>x.checked)&&!parent.checked}});let viewModule=document.querySelector('[data-management-module="view"]'),views=managementPermissionTree.map(page=>document.querySelector(`[data-permission="${page.view}"]`)).filter(Boolean);if(viewModule){viewModule.checked=views.length>0&&views.every(x=>x.checked);viewModule.indeterminate=views.some(x=>x.checked)&&!viewModule.checked}let actionModule=document.querySelector('[data-management-module="action"]'),actionParents=managementPermissionTree.map(page=>document.querySelector(`[data-management-page="${page.id}.action"]`)).filter(Boolean);if(actionModule){actionModule.checked=actionParents.length>0&&actionParents.every(x=>x.checked);actionModule.indeterminate=actionParents.some(x=>x.checked||x.indeterminate)&&!actionModule.checked}}
function savePermissions(){let checked=new Set($$("[data-permission]:checked").map(x=>x.dataset.permission));[...checked].filter(x=>x.startsWith("scope_")||x.endsWith(".export")).forEach(x=>checked.delete(x));if(checked.has("operations.settlement.edit"))checked.add("operations.pnl.view");managementPermissionTree.forEach(page=>{if(page.actions.some(x=>checked.has(x[0])))checked.add(page.view)});rolePermissions[state.activeRole]=checked;render();showToast("权限已保存并立即生效")}
function resetPermissions(id){render();showToast("已恢复为上次保存的权限")}
function render(){window._biCharts.forEach(c=>{try{c.dispose()}catch(e){}});window._biCharts=[];state.seed=(state.stamp.getTime()+state.view.length*997+state.metric.length*311)%999983;let systemViews=["accounts","roles","permissions"],label=config[state.view].title+(state.metric&&metrics[state.view]?" / "+metrics[state.view].find(x=>x.id===state.metric).name:""),group=state.view==="operations"?"财务数据":systemViews.includes(state.view)?"系统管理":"基础数据";$("#group-crumb").textContent=group;$("#crumb").textContent=label;$$("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));$(".top-actions .live").textContent=systemViews.includes(state.view)?"安全访问":state.view==="operations"?"月度数据":"实时数据";$("#content").innerHTML=systemViews.includes(state.view)?systemPage():state.view==="operations"?operationsStatementPage():(state.metric?metricDetail():category());if(state.view==="permissions")requestAnimationFrame(()=>{syncPermissionParents();syncManagementParents();syncPageOperations()});else if(!systemViews.includes(state.view))requestAnimationFrame(after);location.hash=state.view+(state.metric?"/"+state.metric:"")}
function go(v){state.view=v;state.metric="";state.filters={};state.dimensionMode="category";state.symbolLimit="10";state.extraSymbols=[];state.showRanking=false;render()}function openMetric(id){state.metric=id;state.filters={};state.dimensionMode="category";state.symbolLimit="10";state.extraSymbols=[];state.showRanking=false;render()}function closeMetric(){state.metric="";state.filters={};render()}function setMetricFilter(i,v){if(v)state.filters[i]=v;else delete state.filters[i];render()}function clearMetricFilters(){state.filters={};render()}function setDimensionMode(mode){state.dimensionMode=mode;state.filters={};state.extraSymbols=[];state.showRanking=false;render()}function setSymbolLimit(v){state.symbolLimit=v;render()}function toggleRanking(){state.showRanking=!state.showRanking;render()}function setOperationMonth(v){if(v)state.operationMonth=v;render()}function toggleFloating(){state.includeFloating=!state.includeFloating;render()}function toggleOperatingCost(){state.showOperatingCost=!state.showOperatingCost;render()}function toggleGrossProfit(){state.showGrossProfit=!state.showGrossProfit;render()}function setPeriod(p){state.period=p;if(p==="custom"&&!state.start){let e=new Date(),s=new Date(Date.now()-6*86400000);state.start=date(s);state.end=date(e)}render()}function applyCustom(){state.start=$("#start").value;state.end=$("#end").value;render()}function refresh(){state.stamp=new Date();render()}function reset(){state.period="30d";state.start="";state.end="";refresh()}
window.addEventListener("resize",()=>window._biCharts.forEach(c=>c.resize()));let init=location.hash.slice(1).split("/");if(config[init[0]])state.view=init[0];if(init[1]&&metrics[state.view]&&metrics[state.view].some(x=>x.id===init[1]))state.metric=init[1];render();
</script>
