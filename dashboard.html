<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BI System - Real-time Overview</title>
  <meta name="description" content="BI System Operations Data Center - Real-time Overview" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;padding:0;">
  <div id="sidebar-root"></div>

  <script src="sidebar.js"></script>
  <script src="lang-switch.js"></script>
  <script src="bi-data.js"></script>
  <script src="bi-charts.js"></script>
  <script>
    var lang = 'en';
    var activePath = 'index';
    injectSidebar({ activePath: activePath, lang: lang });

    (function () {
      'use strict';

      // ===== i18n =====
      var t = {
        pageTitle: 'Real-time Overview',
        realtimeData: 'Real-time Data',
        realtimeDesc: 'Real-time statistical snapshot. Refresh page or click refresh to generate new data.',
        refreshSnapshot: 'Refresh Snapshot',
        resetFilters: 'Reset Filters',
        period: 'Period',
        today: 'Today',
        yesterday: 'Yesterday',
        last7d: 'Last 7 Days',
        last30d: 'Last 30 Days',
        custom: 'Custom',
        startDate: 'Start Date',
        endDate: 'End Date',

        // Customer
        customerSection: 'Customer Data',
        customerDesc: 'Full-funnel conversion: Registration → KYC → Account → First Deposit → Trading',
        registeredUsers: 'Registered Users',
        kycUsers: 'KYC Users',
        openAccounts: 'Open Accounts',
        firstDepositUsers: 'First Deposit Users',
        tradingUsers: 'Trading Users',
        regMethod: 'Registration Method',
        allMethods: 'All Methods',
        phone: 'Phone',
        email: 'Email',
        kycLevel: 'KYC Level',
        allLevels: 'All Levels',
        lv2: 'Lv2 Basic',
        lv3: 'Lv3 Advanced',
        depositChannel: 'Deposit Channel',
        allChannels: 'All Channels',
        bankTransfer: 'Bank Transfer',
        card: 'Credit Card',
        crypto: 'Crypto',
        localTransfer: 'Local Transfer',
        customerFunnel: 'Conversion Funnel',
        customerTrend: 'Conversion Trend',
        regionRank: 'Registration by Region',
        qoq: 'vs last period',

        // Funding
        fundingSection: 'Funding Data',
        fundingDesc: 'Deposits, withdrawals, net deposits, pending withdrawals',
        depositUsers: 'Deposit Users',
        depositAmount: 'Deposit Amount',
        withdrawAmount: 'Withdrawal Amount',
        netDeposit: 'Net Deposit',
        pendingWithdraw: 'Pending Withdrawal',
        usdEquivalent: 'USD equivalent',
        currency: 'Currency',
        allCurrencies: 'All Currencies',
        usd: 'USD',
        aed: 'AED',
        usdt: 'USDT',
        withdrawChannel: 'Withdrawal Channel',
        fundingTrend: 'Deposit / Withdrawal / Net Trend',
        currencyBreakdown: 'Currency Breakdown',
        channelRank: 'Deposit Channel Rank',

        // Trading
        tradingSection: 'Trading Data',
        tradingDesc: 'Open orders, trading accounts, open lots',
        openOrders: 'Open Orders',
        tradingAccounts: 'Trading Accounts',
        openLots: 'Open Lots',
        category: 'Category',
        allCategories: 'All Categories',
        forex: 'Forex',
        metals: 'Metals',
        energy: 'Energy',
        indices: 'Indices',
        crypto: 'Crypto',
        symbol: 'Symbol',
        allSymbols: 'All Symbols',
        orderLotTrend: 'Orders & Lots Trend',
        symbolRank: 'Symbols by Open Lots',
        orders: 'Orders',
        lots: 'Lots',

        // Generic
        persons: '',
        accounts: '',
        lotsUnit: '',
        noData: 'No data',
        updatedAt: 'Updated at',
        dataNote: 'Demo data for display purposes only'
      };

      // ===== State =====
      var state = {
        period: '7d',
        customStart: '',
        customEnd: '',
        regMethod: 'all',
        kycLevel: 'all',
        depositChannel_customer: 'all',
        currency: 'all',
        depositChannel_funding: 'all',
        withdrawChannel: 'all',
        category: 'all',
        symbol: 'all',
        collapsed: {
          customer: false,
          funding: false,
          trading: false
        }
      };

      // ===== Main Render =====
      function render() {
        var contentEl = document.getElementById('page-content');
        if (!contentEl) return;

        var snapshot = getSnapshot();
        var html = '';

        html += '<div class="info-banner">';
        html += '  <i class="fas fa-sync-alt"></i>';
        html += '  <span>' + t.realtimeData + ' · ' + t.updatedAt + ':</span>';
        html += '  <span class="timestamp">' + BiData.formatDateTime(snapshot.timestamp) + '</span>';
        html += '  <span style="margin-left:12px;color:#64748B;">' + t.dataNote + '</span>';
        html += '</div>';

        html += renderFilterBar(snapshot);
        html += renderCustomerSection(snapshot);
        html += renderFundingSection(snapshot);
        html += renderTradingSection(snapshot);

        contentEl.innerHTML = html;
        bindEvents();

        setTimeout(function () { initCharts(snapshot); }, 50);
      }

      function getSnapshot() {
        return BiData.getSnapshot(state.period, state.customStart, state.customEnd, {
          regMethod: state.regMethod,
          kycLevel: state.kycLevel,
          depositChannel: state.depositChannel_funding === 'all' ? state.depositChannel_customer : state.depositChannel_funding,
          currency: state.currency,
          withdrawChannel: state.withdrawChannel,
          category: state.category,
          symbol: state.symbol
        });
      }

      function renderFilterBar(snapshot) {
        var dateQuick = ['today', 'yesterday', '7d', '30d'];
        var dateLabels = { today: t.today, yesterday: t.yesterday, '7d': t.last7d, '30d': t.last30d };

        var html = '';
        html += '<div class="filter-bar">';
        html += '<div class="date-tabs" id="date-tabs">';
        dateQuick.forEach(function (d) {
          html += '<div class="date-tab ' + (state.period === d ? 'active' : '') + '" data-period="' + d + '">' + dateLabels[d] + '</div>';
        });
        html += '<div class="date-tab ' + (state.period === 'custom' ? 'active' : '') + '" data-period="custom">' + t.custom + '</div>';
        html += '</div>';

        if (state.period === 'custom') {
          html += '<input type="date" class="select-control" id="custom-start" value="' + state.customStart + '" style="width:130px;" />';
          html += '<span style="color:#94A3B8;">~</span>';
          html += '<input type="date" class="select-control" id="custom-end" value="' + state.customEnd + '" style="width:130px;" />';
        }

        html += '<div style="flex:1;"></div>';

        html += '<span style="font-size:12px;color:#64748B;">';
        html += t.period + ': ' + BiData.formatDate(snapshot.range.start) + ' ~ ' + BiData.formatDate(snapshot.range.end) + ' (' + snapshot.days + 'd)';
        html += '</span>';

        html += '<button class="btn btn-refresh" id="btn-refresh"><i class="fas fa-sync-alt"></i> ' + t.refreshSnapshot + '</button>';
        html += '<button class="btn btn-reset" id="btn-reset"><i class="fas fa-redo"></i> ' + t.resetFilters + '</button>';
        html += '</div>';
        return html;
      }

      // ===== Customer Section =====
      function renderCustomerSection(snapshot) {
        var c = snapshot.customer;
        var prevReg = Math.round(c.registeredUsers / c.prevFactor);
        var regChange = ((c.registeredUsers - prevReg) / prevReg) * 100;

        var html = '';
        html += '<div class="card section-card">';
        html += '  <div class="section-header" id="toggle-customer">';
        html += '    <div class="section-header-left">';
        html += '      <div class="section-icon blue"><i class="fas fa-users"></i></div>';
        html += '      <div>';
        html += '        <h2 class="section-title">' + t.customerSection + '</h2>';
        html += '        <div class="section-desc">' + t.customerDesc + '</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="section-header-right">';
        html += '<select class="select-control" id="filter-regmethod">';
        html += '  <option value="all"' + (state.regMethod === 'all' ? ' selected' : '') + '>' + t.allMethods + '</option>';
        html += '  <option value="phone"' + (state.regMethod === 'phone' ? ' selected' : '') + '>' + t.phone + '</option>';
        html += '  <option value="email"' + (state.regMethod === 'email' ? ' selected' : '') + '>' + t.email + '</option>';
        html += '</select>';
        html += '<select class="select-control" id="filter-kyclevel">';
        html += '  <option value="all"' + (state.kycLevel === 'all' ? ' selected' : '') + '>' + t.allLevels + '</option>';
        html += '  <option value="lv2"' + (state.kycLevel === 'lv2' ? ' selected' : '') + '>' + t.lv2 + '</option>';
        html += '  <option value="lv3"' + (state.kycLevel === 'lv3' ? ' selected' : '') + '>' + t.lv3 + '</option>';
        html += '</select>';
        html += '<select class="select-control" id="filter-depch-customer">';
        html += '  <option value="all"' + (state.depositChannel_customer === 'all' ? ' selected' : '') + '>' + t.allChannels + '</option>';
        html += '  <option value="bank"' + (state.depositChannel_customer === 'bank' ? ' selected' : '') + '>' + t.bankTransfer + '</option>';
        html += '  <option value="card"' + (state.depositChannel_customer === 'card' ? ' selected' : '') + '>' + t.card + '</option>';
        html += '  <option value="crypto"' + (state.depositChannel_customer === 'crypto' ? ' selected' : '') + '>' + t.crypto + '</option>';
        html += '  <option value="local"' + (state.depositChannel_customer === 'local' ? ' selected' : '') + '>' + t.localTransfer + '</option>';
        html += '</select>';
        html += '      <button class="section-collapse-btn" id="collapse-customer"><i class="fas fa-chevron-up transition-transform ' + (state.collapsed.customer ? 'rotate-180' : '') + '"></i></button>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="section-body' + (state.collapsed.customer ? ' collapsed' : '') + '" id="body-customer">';

        html += '<div class="kpi-grid">';
        html += renderKpiCard({ icon: 'fa-user-plus', iconColor: 'blue', label: t.registeredUsers, value: BiData.formatNumber(c.registeredUsers), unit: t.persons, change: regChange, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-id-card', iconColor: 'purple', label: t.kycUsers, value: BiData.formatNumber(c.kycUsers), unit: t.persons, change: regChange * 0.9, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-wallet', iconColor: 'cyan', label: t.openAccounts, value: BiData.formatNumber(c.openAccounts), unit: t.accounts, change: regChange * 0.8, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-coins', iconColor: 'green', label: t.firstDepositUsers, value: BiData.formatNumber(c.firstDepositUsers), unit: t.persons, change: regChange * 1.1, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-chart-line', iconColor: 'orange', label: t.tradingUsers, value: BiData.formatNumber(c.tradingUsers), unit: t.persons, change: regChange * 0.7, changeLabel: t.qoq });
        html += '</div>';

        html += '<div class="chart-grid" style="grid-template-columns: 1fr 1fr 1fr;">';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header"><h3 class="chart-card-title">' + t.customerFunnel + '</h3></div>';
        html += '  <div class="chart-container small" id="chart-customer-funnel"></div>';
        html += '</div>';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header">';
        html += '    <h3 class="chart-card-title">' + t.customerTrend + '</h3>';
        html += '    <div class="chart-legend">';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#3B82F6;"></span>' + t.registeredUsers + '</span>';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#10B981;"></span>' + t.tradingUsers + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="chart-container small" id="chart-customer-trend"></div>';
        html += '</div>';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header"><h3 class="chart-card-title">' + t.regionRank + '</h3></div>';
        html += '  <div class="chart-container small" id="chart-region-rank"></div>';
        html += '</div>';

        html += '</div></div></div>';
        return html;
      }

      // ===== Funding Section =====
      function renderFundingSection(snapshot) {
        var f = snapshot.funding;
        var prevDeposit = Math.round(f.depositAmount / f.prevFactor);
        var depChange = ((f.depositAmount - prevDeposit) / prevDeposit) * 100;

        var html = '';
        html += '<div class="card section-card" style="margin-top:20px;">';
        html += '  <div class="section-header" id="toggle-funding">';
        html += '    <div class="section-header-left">';
        html += '      <div class="section-icon green"><i class="fas fa-money-bill-wave"></i></div>';
        html += '      <div>';
        html += '        <h2 class="section-title">' + t.fundingSection + '</h2>';
        html += '        <div class="section-desc">' + t.fundingDesc + ' · ' + t.usdEquivalent + '</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="section-header-right">';
        html += '<select class="select-control" id="filter-currency">';
        html += '  <option value="all"' + (state.currency === 'all' ? ' selected' : '') + '>' + t.allCurrencies + '</option>';
        html += '  <option value="usd"' + (state.currency === 'usd' ? ' selected' : '') + '>' + t.usd + '</option>';
        html += '  <option value="aed"' + (state.currency === 'aed' ? ' selected' : '') + '>' + t.aed + '</option>';
        html += '</select>';
        html += '<select class="select-control" id="filter-depch-funding">';
        html += '  <option value="all"' + (state.depositChannel_funding === 'all' ? ' selected' : '') + '>' + t.allChannels + '</option>';
        html += '  <option value="bank"' + (state.depositChannel_funding === 'bank' ? ' selected' : '') + '>' + t.bankTransfer + '</option>';
        html += '  <option value="card"' + (state.depositChannel_funding === 'card' ? ' selected' : '') + '>' + t.card + '</option>';
        html += '  <option value="crypto"' + (state.depositChannel_funding === 'crypto' ? ' selected' : '') + '>' + t.crypto + '</option>';
        html += '  <option value="local"' + (state.depositChannel_funding === 'local' ? ' selected' : '') + '>' + t.localTransfer + '</option>';
        html += '</select>';
        html += '<select class="select-control" id="filter-wdch">';
        html += '  <option value="all"' + (state.withdrawChannel === 'all' ? ' selected' : '') + '>' + t.withdrawChannel + ': ' + t.allChannels + '</option>';
        html += '  <option value="bank"' + (state.withdrawChannel === 'bank' ? ' selected' : '') + '>' + t.bankTransfer + '</option>';
        html += '  <option value="card"' + (state.withdrawChannel === 'card' ? ' selected' : '') + '>' + t.card + '</option>';
        html += '  <option value="crypto"' + (state.withdrawChannel === 'crypto' ? ' selected' : '') + '>' + t.crypto + '</option>';
        html += '  <option value="local"' + (state.withdrawChannel === 'local' ? ' selected' : '') + '>' + t.localTransfer + '</option>';
        html += '</select>';
        html += '      <button class="section-collapse-btn" id="collapse-funding"><i class="fas fa-chevron-up transition-transform ' + (state.collapsed.funding ? 'rotate-180' : '') + '"></i></button>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="section-body' + (state.collapsed.funding ? ' collapsed' : '') + '" id="body-funding">';

        html += '<div class="kpi-grid">';
        html += renderKpiCard({ icon: 'fa-arrow-down', iconColor: 'green', label: t.depositUsers, value: BiData.formatNumber(f.depositUsers), unit: t.persons, change: depChange * 0.8, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-dollar-sign', iconColor: 'blue', label: t.depositAmount, value: '$' + BiData.formatNumber(f.depositAmount), change: depChange, changeLabel: t.qoq, sub: t.usdEquivalent });
        html += renderKpiCard({ icon: 'fa-arrow-up', iconColor: 'red', label: t.withdrawAmount, value: '$' + BiData.formatNumber(f.withdrawAmount), change: depChange * 0.95, changeLabel: t.qoq, sub: t.usdEquivalent });
        html += renderKpiCard({ icon: 'fa-balance-scale', iconColor: 'purple', label: t.netDeposit, value: '$' + BiData.formatNumber(f.netDeposit), change: depChange * 1.1, changeLabel: t.qoq, sub: t.usdEquivalent });
        html += renderKpiCard({ icon: 'fa-clock', iconColor: 'orange', label: t.pendingWithdraw, value: '$' + BiData.formatNumber(f.pendingWithdraw), change: depChange * 0.6, changeLabel: t.qoq, sub: t.usdEquivalent });
        html += '</div>';

        html += '<div class="chart-grid" style="grid-template-columns: 2fr 1fr 1fr;">';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header">';
        html += '    <h3 class="chart-card-title">' + t.fundingTrend + '</h3>';
        html += '    <div class="chart-legend">';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#10B981;"></span>' + t.depositAmount + '</span>';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#EF4444;"></span>' + t.withdrawAmount + '</span>';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#8B5CF6;"></span>' + t.netDeposit + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="chart-container" id="chart-funding-trend"></div>';
        html += '</div>';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header"><h3 class="chart-card-title">' + t.currencyBreakdown + '</h3></div>';
        html += '  <div class="chart-container" id="chart-currency-donut" style="position:relative;"></div>';
        html += '</div>';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header"><h3 class="chart-card-title">' + t.channelRank + '</h3></div>';
        html += '  <div class="chart-container" id="chart-channel-rank"></div>';
        html += '</div>';

        html += '</div></div></div>';
        return html;
      }

      // ===== Trading Section =====
      function renderTradingSection(snapshot) {
        var tr = snapshot.trading;
        var prevOrders = Math.round(tr.openOrders / tr.prevFactor);
        var ordChange = ((tr.openOrders - prevOrders) / prevOrders) * 100;

        var categoryOptions = [
          { val: 'all', label: t.allCategories },
          { val: 'forex', label: t.forex },
          { val: 'metals', label: t.metals },
          { val: 'energy', label: t.energy },
          { val: 'indices', label: t.indices },
          { val: 'crypto', label: t.crypto }
        ];

        var html = '';
        html += '<div class="card section-card" style="margin-top:20px;">';
        html += '  <div class="section-header" id="toggle-trading">';
        html += '    <div class="section-header-left">';
        html += '      <div class="section-icon purple"><i class="fas fa-chart-bar"></i></div>';
        html += '      <div>';
        html += '        <h2 class="section-title">' + t.tradingSection + '</h2>';
        html += '        <div class="section-desc">' + t.tradingDesc + '</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="section-header-right">';
        html += '<select class="select-control" id="filter-category">';
        categoryOptions.forEach(function (opt) {
          html += '  <option value="' + opt.val + '"' + (state.category === opt.val ? ' selected' : '') + '>' + opt.label + '</option>';
        });
        html += '</select>';
        html += '<select class="select-control" id="filter-symbol">';
        html += '  <option value="all">' + t.allSymbols + '</option>';
        var symbolList = state.category === 'all' ? [] : (tr.symbols[state.category] || []);
        symbolList.forEach(function (sym) {
          html += '  <option value="' + sym + '"' + (state.symbol === sym ? ' selected' : '') + '>' + sym + '</option>';
        });
        html += '</select>';
        html += '      <button class="section-collapse-btn" id="collapse-trading"><i class="fas fa-chevron-up transition-transform ' + (state.collapsed.trading ? 'rotate-180' : '') + '"></i></button>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="section-body' + (state.collapsed.trading ? ' collapsed' : '') + '" id="body-trading">';

        html += '<div class="kpi-grid cols-3">';
        html += renderKpiCard({ icon: 'fa-file-invoice', iconColor: 'blue', label: t.openOrders, value: BiData.formatNumber(tr.openOrders), unit: '', change: ordChange, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-user-circle', iconColor: 'cyan', label: t.tradingAccounts, value: BiData.formatNumber(tr.tradingAccounts), unit: t.accounts, change: ordChange * 0.7, changeLabel: t.qoq });
        html += renderKpiCard({ icon: 'fa-hand-holding-usd', iconColor: 'orange', label: t.openLots, value: BiData.formatNumber(tr.totalLots), unit: t.lotsUnit, change: ordChange * 0.9, changeLabel: t.qoq });
        html += '</div>';

        html += '<div class="chart-grid equal">';
        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header">';
        html += '    <h3 class="chart-card-title">' + t.orderLotTrend + '</h3>';
        html += '    <div class="chart-legend">';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#3B82F6;"></span>' + t.orders + '</span>';
        html += '      <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#10B981;"></span>' + t.lots + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="chart-container" id="chart-trading-dual"></div>';
        html += '</div>';

        html += '<div class="chart-card">';
        html += '  <div class="chart-card-header"><h3 class="chart-card-title">' + t.symbolRank + '</h3></div>';
        html += '  <div class="chart-container" id="chart-symbol-rank"></div>';
        html += '</div>';
        html += '</div></div></div>';
        return html;
      }

      function renderKpiCard(opts) {
        var trendCls = opts.change > 0 ? 'up' : (opts.change < 0 ? 'down' : 'flat');
        var trendIcon = opts.change > 0 ? 'fa-arrow-up' : (opts.change < 0 ? 'fa-arrow-down' : 'fa-minus');
        var changePct = Math.abs(opts.change).toFixed(1) + '%';

        var html = '';
        html += '<div class="kpi-card">';
        html += '  <div class="kpi-top"><div class="kpi-icon ' + opts.iconColor + '"><i class="fas ' + opts.icon + '"></i></div></div>';
        html += '  <div class="kpi-label">' + opts.label + '</div>';
        html += '  <div class="kpi-value">' + opts.value;
        if (opts.unit) html += '<span class="kpi-unit">' + opts.unit + '</span>';
        html += '  </div>';
        html += '  <span class="kpi-trend ' + trendCls + '"><i class="fas ' + trendIcon + '"></i> ' + changePct + '</span>';
        html += '  <span class="kpi-trend-sub">' + opts.changeLabel + '</span>';
        if (opts.sub) html += '<div style="font-size:11px;color:#94A3B8;margin-top:4px;">' + opts.sub + '</div>';
        html += '</div>';
        return html;
      }

      // ===== Charts =====
      function initCharts(snapshot) {
        var dates = snapshot.dates;
        var dateLabels = dates.map(function (d) { return BiData.formatShortDate(d); });

        // Customer funnel
        var funnelEl = document.getElementById('chart-customer-funnel');
        if (funnelEl) {
          var c = snapshot.customer;
          BiCharts.renderFunnelChart(funnelEl, {
            items: [
              { label: t.registeredUsers, value: c.registeredUsers },
              { label: t.kycUsers, value: c.kycUsers },
              { label: t.openAccounts, value: c.openAccounts },
              { label: t.firstDepositUsers, value: c.firstDepositUsers },
              { label: t.tradingUsers, value: c.tradingUsers }
            ],
            valueFormatter: function (v) { return BiData.formatNumber(v); }
          });
        }

        // Customer trend
        var trendEl = document.getElementById('chart-customer-trend');
        if (trendEl) {
          var c = snapshot.customer;
          var regDaily = c.dailyReg;
          var tradeDaily = regDaily.map(function (v) { return Math.round(v * c.tradeRate * c.openAccRate * c.kycRate); });
          BiCharts.renderMultiLineChart(trendEl, {
            series: [
              { data: regDaily, color: '#3B82F6', label: t.registeredUsers },
              { data: tradeDaily, color: '#10B981', label: t.tradingUsers }
            ],
            labels: dateLabels,
            valueFormatter: function (v) { return BiData.formatNumber(v); }
          });
        }

        // Region rank
        var regionEl = document.getElementById('chart-region-rank');
        if (regionEl) {
          var enRegions = {
            '华东地区': 'East China', '华南地区': 'South China', '华北地区': 'North China',
            '西南地区': 'Southwest', '华中地区': 'Central', '西北地区': 'Northwest',
            '东北地区': 'Northeast'
          };
          BiCharts.renderHorizontalBars(regionEl, {
            items: snapshot.regions.slice(0, 7).map(function (r) {
              return { label: enRegions[r.name] || r.name, value: r.value };
            }),
            showRank: true,
            colors: ['#3B82F6', '#22D3EE', '#10B981', '#8B5CF6', '#F59E0B', '#F97316', '#EC4899'],
            valueFormatter: function (v) { return BiData.formatNumber(v); }
          });
        }

        // Funding trend
        var fundingTrendEl = document.getElementById('chart-funding-trend');
        if (fundingTrendEl) {
          var f = snapshot.funding;
          var netDaily = f.dailyDeposit.map(function (v, i) { return v - (f.dailyWithdraw[i] || 0); });
          BiCharts.renderMultiLineChart(fundingTrendEl, {
            series: [
              { data: f.dailyDeposit, color: '#10B981', label: t.depositAmount },
              { data: f.dailyWithdraw, color: '#EF4444', label: t.withdrawAmount },
              { data: netDaily, color: '#8B5CF6', label: t.netDeposit }
            ],
            labels: dateLabels,
            valueFormatter: function (v) { return BiCharts.formatAmount(v); }
          });
        }

        // Currency donut
        var donutEl = document.getElementById('chart-currency-donut');
        if (donutEl) {
          var f2 = snapshot.funding;
          var cr = f2.currencyRatios;
          var total = f2.depositAmount;
          BiCharts.renderDonutChart(donutEl, {
            items: [
              { label: 'USD', value: Math.round(total * cr.usd), color: '#3B82F6' },
              { label: 'AED', value: Math.round(total * cr.aed), color: '#10B981' },
              { label: 'USDT', value: Math.round(total * cr.usdt), color: '#8B5CF6' }
            ],
            centerLabel: t.depositAmount,
            centerValue: '$' + BiData.formatNumber(total)
          });
        }

        // Channel rank
        var channelEl = document.getElementById('chart-channel-rank');
        if (channelEl) {
          var f3 = snapshot.funding;
          var chR = f3.channelRatios;
          var chLabels = { bank: t.bankTransfer, card: t.card, crypto: t.crypto, local: t.localTransfer };
          var chColors = { bank: '#3B82F6', card: '#10B981', crypto: '#8B5CF6', local: '#F59E0B' };
          var channels = Object.keys(chR).map(function (k) {
            return { label: chLabels[k], value: Math.round(f3.depositAmount * chR[k]), color: chColors[k] };
          }).sort(function (a, b) { return b.value - a.value; });
          BiCharts.renderHorizontalBars(channelEl, {
            items: channels,
            showRank: false,
            valueFormatter: function (v) { return '$' + BiData.formatNumber(v); }
          });
        }

        // Trading dual axis
        var dualEl = document.getElementById('chart-trading-dual');
        if (dualEl) {
          var tr = snapshot.trading;
          BiCharts.renderDualAxisChart(dualEl, {
            leftSeries: { data: tr.dailyOrders, color: '#3B82F6', label: t.orders },
            rightSeries: { data: tr.dailyLots, color: '#10B981', label: t.lots },
            labels: dateLabels,
            leftFormatter: function (v) { return BiData.formatNumber(v); },
            rightFormatter: function (v) { return BiData.formatNumber(v); }
          });
        }

        // Symbol rank
        var symbolEl = document.getElementById('chart-symbol-rank');
        if (symbolEl) {
          var tr2 = snapshot.trading;
          var symItems = Object.keys(tr2.symbolLots).map(function (k) {
            return { label: k, value: tr2.symbolLots[k] };
          }).sort(function (a, b) { return b.value - a.value; });
          BiCharts.renderHorizontalBars(symbolEl, {
            items: symItems,
            showRank: true,
            colors: ['#3B82F6', '#8B5CF6', '#10B981', '#F59E0B', '#EC4899', '#06B6D4', '#F97316', '#14B8A6'],
            valueFormatter: function (v) { return BiData.formatNumber(v); }
          });
        }
      }

      // ===== Events =====
      function bindEvents() {
        var dateTabs = document.querySelectorAll('.date-tab[data-period]');
        dateTabs.forEach(function (tab) {
          tab.addEventListener('click', function () {
            state.period = this.getAttribute('data-period');
            if (state.period === 'custom' && !state.customStart) {
              var today = new Date();
              var weekAgo = new Date(today.getTime() - 7 * 86400000);
              state.customEnd = BiData.formatDate(today);
              state.customStart = BiData.formatDate(weekAgo);
            }
            render();
          });
        });

        var startEl = document.getElementById('custom-start');
        var endEl = document.getElementById('custom-end');
        if (startEl) startEl.addEventListener('change', function () { state.customStart = this.value; render(); });
        if (endEl) endEl.addEventListener('change', function () { state.customEnd = this.value; render(); });

        var btnRefresh = document.getElementById('btn-refresh');
        if (btnRefresh) btnRefresh.addEventListener('click', function () { BiData.refresh(); render(); });

        var btnReset = document.getElementById('btn-reset');
        if (btnReset) btnReset.addEventListener('click', function () {
          state = {
            period: '7d', customStart: '', customEnd: '',
            regMethod: 'all', kycLevel: 'all', depositChannel_customer: 'all',
            currency: 'all', depositChannel_funding: 'all', withdrawChannel: 'all',
            category: 'all', symbol: 'all',
            collapsed: { customer: false, funding: false, trading: false }
          };
          BiData.refresh();
          render();
        });

        bindSelect('filter-regmethod', 'regMethod');
        bindSelect('filter-kyclevel', 'kycLevel');
        bindSelect('filter-depch-customer', 'depositChannel_customer');
        bindSelect('filter-currency', 'currency');
        bindSelect('filter-depch-funding', 'depositChannel_funding');
        bindSelect('filter-wdch', 'withdrawChannel');

        var catEl = document.getElementById('filter-category');
        if (catEl) catEl.addEventListener('change', function () {
          state.category = this.value;
          state.symbol = 'all';
          render();
        });
        bindSelect('filter-symbol', 'symbol');

        ['customer', 'funding', 'trading'].forEach(function (section) {
          var toggleBtn = document.getElementById('toggle-' + section);
          if (toggleBtn) toggleBtn.addEventListener('click', function () {
            state.collapsed[section] = !state.collapsed[section];
            render();
          });
        });
      }

      function bindSelect(id, stateKey) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', function (e) {
          e.stopPropagation();
          state[stateKey] = this.value;
          render();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
