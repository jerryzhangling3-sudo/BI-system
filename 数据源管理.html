<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BI System - 数据源管理</title>
  <meta name="description" content="BI System 商业智能平台 - 数据源管理" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;padding:0;">
  <div id="sidebar-root"></div>

  <script src="sidebar.js"></script>
  <script src="lang-switch.js"></script>
  <script>
    var lang = 'zh';
    var activePath = 'data-sources';
    injectSidebar({ activePath: activePath, lang: lang });

    (function () {
      var t = {
        pageTitle: '数据源管理',
        pageSubtitle: '管理所有接入的数据来源与连接配置',
        addSource: '添加数据源',
        search: '搜索数据源...',
        name: '数据源名称',
        type: '类型',
        host: '主机地址',
        status: '状态',
        lastSync: '最后同步',
        owner: '负责人',
        actions: '操作',
        online: '已连接',
        offline: '已断开',
        syncing: '同步中',
        error: '异常',
        test: '测试连接',
        edit: '编辑',
        delete: '删除',
        totalSources: '数据源总数',
        onlineCount: '正常连接',
        syncCount: '今日同步次数',
        dataVolume: '数据总量'
      };

      document.title = 'BI System - 数据源管理';

      var sources = [
        { id: 'DS-001', name: '业务主数据库', type: 'MySQL', host: 'db-prod-01.internal:3306', status: 'online', lastSync: '2024-01-31 14:30:00', owner: '运维组', size: '128.5 GB', tables: 86 },
        { id: 'DS-002', name: '用户行为日志', type: 'ClickHouse', host: 'clickhouse-analytics:9000', status: 'online', lastSync: '2024-01-31 14:25:00', owner: '数据组', size: '2.4 TB', tables: 32 },
        { id: 'DS-003', name: '订单数据仓库', type: 'PostgreSQL', host: 'dw-order.internal:5432', status: 'syncing', lastSync: '2024-01-31 14:20:00', owner: '数据组', size: '512 GB', tables: 64 },
        { id: 'DS-004', name: '客户关系系统', type: 'API', host: 'api.crm.example.com', status: 'online', lastSync: '2024-01-31 13:00:00', owner: '产品组', size: 'N/A', tables: 12 },
        { id: 'DS-005', name: '营销数据平台', type: 'MongoDB', host: 'mongo-marketing:27017', status: 'error', lastSync: '2024-01-30 22:15:00', owner: '营销组', size: '86 GB', tables: 24 },
        { id: 'DS-006', name: '财务核算系统', type: 'Oracle', host: 'oracle-finance:1521', status: 'online', lastSync: '2024-01-31 08:00:00', owner: '财务组', size: '320 GB', tables: 156 },
        { id: 'DS-007', name: '实时消息队列', type: 'Kafka', host: 'kafka-stream:9092', status: 'online', lastSync: '2024-01-31 14:32:00', owner: '架构组', size: '实时', tables: 18 },
        { id: 'DS-008', name: '对象存储数据湖', type: 'S3', host: 's3://data-lake-prod', status: 'offline', lastSync: '2024-01-28 16:00:00', owner: '运维组', size: '15.6 TB', tables: 200 }
      ];

      var statusMap = {
        online: { label: '已连接', cls: 'badge-success', dot: 'green' },
        offline: { label: '已断开', cls: 'badge-default', dot: 'gray' },
        syncing: { label: '同步中', cls: 'badge-info', dot: 'gray' },
        error: { label: '异常', cls: 'badge-danger', dot: 'red' }
      };

      var typeIcons = {
        'MySQL': { icon: 'fa-database', color: '#3B82F6' },
        'PostgreSQL': { icon: 'fa-database', color: '#336791' },
        'ClickHouse': { icon: 'fa-chart-column', color: '#FFCC01' },
        'MongoDB': { icon: 'fa-leaf', color: '#13AA52' },
        'Oracle': { icon: 'fa-database', color: '#F80000' },
        'Kafka': { icon: 'fa-stream', color: '#231F20' },
        'S3': { icon: 'fa-bucket', color: '#FF9900' },
        'API': { icon: 'fa-plug', color: '#8B5CF6' }
      };

      var contentEl = document.getElementById('page-content');
      var html = '';

      // 页头
      html += '<div class="page-header">';
      html += '  <div>';
      html += '    <h1>' + t.pageTitle + '</h1>';
      html += '    <p>' + t.pageSubtitle + '</p>';
      html += '  </div>';
      html += '  <div class="flex gap-3">';
      html += '    <div class="search-box">';
      html += '      <i class="fas fa-search"></i>';
      html += '      <input type="text" placeholder="' + t.search + '" />';
      html += '    </div>';
      html += '    <button class="btn btn-primary"><i class="fas fa-plus"></i> ' + t.addSource + '</button>';
      html += '  </div>';
      html += '</div>';

      // 概览 KPI
      html += '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">';
      html += buildSmallKpi('fa-database', t.totalSources, '8', 'blue');
      html += buildSmallKpi('fa-check-circle', t.onlineCount, '6 / 8', 'green');
      html += buildSmallKpi('fa-sync', t.syncCount, '248 次', 'purple');
      html += buildSmallKpi('fa-hard-drive', t.dataVolume, '19.2 TB', 'orange');
      html += '</div>';

      // 数据列表
      html += '<div class="card">';
      html += '  <div class="card-header">';
      html += '    <h3 class="card-title">数据源列表</h3>';
      html += '    <div class="flex gap-2">';
      html += '      <button class="btn btn-secondary btn-sm">全部类型</button>';
      html += '      <button class="btn btn-secondary btn-sm">全部状态</button>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div style="overflow-x:auto;">';
      html += '    <table class="data-table">';
      html += '      <thead>';
      html += '        <tr>';
      html += '          <th style="width:40px;"></th>';
      html += '          <th>' + t.name + '</th>';
      html += '          <th>' + t.type + '</th>';
      html += '          <th>' + t.host + '</th>';
      html += '          <th>' + t.status + '</th>';
      html += '          <th>' + t.lastSync + '</th>';
      html += '          <th>' + t.owner + '</th>';
      html += '          <th>数据量</th>';
      html += '          <th class="text-right">' + t.actions + '</th>';
      html += '        </tr>';
      html += '      </thead>';
      html += '      <tbody>';

      sources.forEach(function (s) {
        var st = statusMap[s.status];
        var ti = typeIcons[s.type] || { icon: 'fa-database', color: '#64748B' };
        html += '<tr>';
        html += '  <td><div style="width:36px;height:36px;border-radius:8px;background:' + ti.color + '15;display:flex;align-items:center;justify-content:center;color:' + ti.color + ';"><i class="fas ' + ti.icon + '"></i></div></td>';
        html += '  <td>';
        html += '    <div style="font-weight:600;color:#0F172A;">' + s.name + '</div>';
        html += '    <div style="font-size:12px;color:#94A3B8;" class="mono">' + s.id + '</div>';
        html += '  </td>';
        html += '  <td><span class="badge badge-default">' + s.type + '</span></td>';
        html += '  <td class="mono" style="color:#64748B;font-size:12px;">' + s.host + '</td>';
        html += '  <td><span class="badge ' + st.cls + '"><span class="status-dot ' + st.dot + '"></span>' + st.label + '</span></td>';
        html += '  <td class="mono" style="color:#64748B;font-size:12px;">' + s.lastSync + '</td>';
        html += '  <td>' + s.owner + '</td>';
        html += '  <td class="mono" style="font-size:12px;">' + s.size + ' / ' + s.tables + ' 表</td>';
        html += '  <td class="text-right">';
        html += '    <button class="icon-btn" style="width:28px;height:28px;" title="' + t.test + '"><i class="fas fa-plug" style="font-size:12px;"></i></button>';
        html += '    <button class="icon-btn" style="width:28px;height:28px;margin-left:4px;" title="' + t.edit + '"><i class="fas fa-edit" style="font-size:12px;"></i></button>';
        html += '    <button class="icon-btn" style="width:28px;height:28px;margin-left:4px;" title="' + t.delete + '"><i class="fas fa-trash-alt" style="font-size:12px;color:#EF4444;"></i></button>';
        html += '  </td>';
        html += '</tr>';
      });

      html += '      </tbody>';
      html += '    </table>';
      html += '  </div>';
      html += '</div>';

      contentEl.innerHTML = html;

      function buildSmallKpi(icon, label, value, color) {
        var colorMap = {
          blue: { bg: '#EFF6FF', text: '#3B82F6' },
          green: { bg: '#ECFDF5', text: '#10B981' },
          purple: { bg: '#F5F3FF', text: '#8B5CF6' },
          orange: { bg: '#FFF7ED', text: '#F59E0B' }
        };
        var c = colorMap[color];
        return '<div class="kpi-card">' +
          '<div class="kpi-top">' +
          '  <div style="width:40px;height:40px;border-radius:10px;background:' + c.bg + ';color:' + c.text + ';display:flex;align-items:center;justify-content:center;">' +
          '    <i class="fas ' + icon + '"></i>' +
          '  </div>' +
          '</div>' +
          '<div class="kpi-label">' + label + '</div>' +
          '<div class="kpi-value mono" style="font-size:22px;">' + value + '</div>' +
          '</div>';
      }
    })();
  </script>
</body>
</html>
